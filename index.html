<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northern Michigan Golf Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3A5C;
    --navy-soft:#4A6785;
    --birch:#F4EFE6;
    --clay:#A6392C;
    --ink:#22262B;
    --line: rgba(31,58,92,0.16);
    --up: #1F3A5C;
    --down: #A6392C;
    /* legacy aliases kept so existing rules below still resolve */
    --pine:#1F3A5C;
    --fairway:#4A6785;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--birch);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'Space Mono', monospace; }

  /* ---------- Banner ---------- */
  .banner-wrap{
    padding: 14px 14px 4px;
    background: var(--birch);
  }
  .banner{
    background: var(--birch);
    color: var(--navy);
    padding: 26px 20px 22px;
    position: relative;
    border: 1.5px solid var(--navy);
    border-radius: 14px;
    outline: 1px solid var(--clay);
    outline-offset: 5px;
  }
  .banner .crest{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .banner .crest svg{ width:26px; height:26px; flex:none; }
  .banner .eyebrow{
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: var(--navy-soft);
    margin: 0;
  }
  .banner h1{
    font-family:'Playfair Display', 'Source Serif 4', serif;
    font-size: 40px;
    line-height: 1;
    margin: 0 0 8px;
    font-weight: 800;
    color: var(--clay);
    letter-spacing: 0.01em;
  }
  .banner h1 .no-skips{
    font-family:'Source Serif 4', serif;
    font-size: 16px;
    font-weight: 600;
    font-style: italic;
    color: var(--navy);
    letter-spacing: 0.01em;
  }
  .banner .subtitle{
    font-family:'Source Serif 4', serif;
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--navy);
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .banner .dates{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: var(--clay);
    margin: 0 0 3px;
  }
  .banner .place{
    font-size: 12.5px;
    letter-spacing: 0.12em;
    color: var(--navy-soft);
    margin: 0 0 20px;
  }
  .route{
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .route .stop{
    display:grid;
    grid-template-columns: 20px 1fr 58px;
    column-gap: 12px;
    position:relative;
    padding-bottom: 16px;
  }
  .route .stop:last-child{ padding-bottom:0; }
  .route .stop .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--clay);
    margin-top:6px;
    justify-self:center;
    position:relative; z-index:1;
  }
  .route .stop:not(:last-child)::before{
    content:"";
    position:absolute;
    left:9.5px; top:14px; bottom:-4px;
    width:1px;
    background: var(--line);
  }
  .route .stop .logo-cell{
    grid-column: 3;
    grid-row: 1;
    align-self: stretch;
    justify-self: center;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 100%;
  }
  .route .stop .logo-cell img{
    max-width: 58px;
    max-height: 100%;
    width:auto;
    height:auto;
    object-fit: contain;
    display:block;
  }
  .route .stop .logo-cell img.framed{
    border: 1.5px solid #000;
    border-radius: 6px;
    background: #fff;
    padding: 4px;
    box-sizing: border-box;
    max-width: 50px;
  }
  .route .stop .when{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    color: var(--navy-soft);
    margin-bottom:2px;
  }
  .route .stop .where{
    font-size:15px;
    font-weight:700;
    line-height:1.3;
    color: var(--navy);
  }
  .route .stop .fmt{
    font-size:12.5px;
    color: var(--navy-soft);
    margin-top:1px;
  }
  .banner .clubs-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 12px;
    margin-top: 20px;
  }
  .banner .clubs-divider .rule{ height:1px; flex:1; background: var(--line); }
  .banner .clubs-divider svg{ width:20px; height:20px; }

  .field{
    padding: 20px 22px 8px;
  }
  .field h2{
    font-size: 11.5px;
    font-family:'Space Mono', monospace;
    font-weight:400;
    letter-spacing:0.12em;
    color: var(--clay);
    margin: 0 0 10px;
  }
  .golfer-chips{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .chip{
    border:1px solid var(--navy);
    border-radius: 3px;
    padding: 6px 10px;
    font-size: 13.5px;
    color: var(--navy);
    font-weight:600;
  }

  /* ---------- Tabs ---------- */
  .tabbar{
    display:flex;
    overflow-x:auto;
    gap:2px;
    padding: 14px 22px 0;
    border-bottom: 1px solid var(--line);
    -ms-overflow-style: none; scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{ display:none; }
  .tab{
    flex: 0 0 auto;
    background:none; border:none;
    font-family:'Space Mono', monospace;
    font-size: 11.5px;
    letter-spacing:0.01em;
    color: rgba(35,36,32,0.5);
    padding: 8px 12px 10px;
    cursor:pointer;
    border-bottom: 2px solid transparent;
    white-space:nowrap;
  }
  .tab.active{
    color: var(--navy);
    border-bottom-color: var(--clay);
  }

  .panel{ display:none; padding: 20px 22px 40px; }
  .panel.active{ display:block; }

  .round-head{
    margin-bottom: 16px;
  }
  .round-head .course{
    font-family:'Playfair Display', serif;
    font-size: 22px;
    font-weight:700;
    color: var(--clay);
    margin: 0 0 2px;
  }
  .round-head .meta{
    font-family:'Space Mono', monospace;
    font-size: 11.5px;
    letter-spacing:0.04em;
    color: var(--navy-soft);
  }

  .teams{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap: 10px;
    margin: 14px 0 18px;
    padding: 14px;
    background: rgba(31,58,92,0.06);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .teams .side{ font-size:14px; line-height:1.5; color: var(--navy); }
  .teams .side .lbl{ font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:0.08em; color:var(--clay); display:block; margin-bottom:2px; }
  .teams .vs{ font-family:'Space Mono', monospace; font-size:11px; color: var(--clay); }

  .status-banner{
    text-align:center;
    padding: 14px 10px;
    border-radius: 4px;
    background: var(--navy);
    color: var(--birch);
    margin-bottom: 18px;
  }
  .status-banner .line1{ font-family:'Playfair Display', serif; font-size:16px; font-weight:700; line-height:1.3; }
  .status-banner .line2, .status-banner .line3{
    font-family:'Space Mono',monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: rgba(244,239,230,0.75);
    margin-top: 4px;
  }

  table.card{
    width:100%;
    min-width: 720px;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.card th, table.card td{
    padding: 7px 4px;
    text-align:center;
    border-bottom: 1px solid var(--line);
  }
  table.card th{
    font-family:'Space Mono', monospace;
    font-weight:400;
    font-size: 10.5px;
    color: rgba(35,36,32,0.55);
  }
  table.card td.holecol, table.card th.holecol{ text-align:left; font-family:'Space Mono',monospace; }
  table.card input{
    display:block;
    margin: 0 auto;
    width: 30px;
    text-align:center;
    border: 1px solid var(--line);
    border-radius:3px;
    padding: 4px 2px;
    font-family:'Space Mono', monospace;
    font-size: 13px;
    background: #fff;
  }
  .score-wrap, .net-wrap{
    position: relative;
    display: inline-block;
  }
  .score-wrap .stroke-mark, .net-wrap .stroke-mark{
    position: absolute;
    top: -5px;
    right: -6px;
    font-size: 11px;
    line-height: 1;
    color: var(--clay);
    font-weight: 800;
    pointer-events: none;
  }
  .net-col{
    background: rgba(31,58,92,0.03);
    font-weight: 600;
  }
  table.card th.subhdr{
    font-size: 9px;
    color: rgba(35,36,32,0.4);
    padding-top: 2px;
    padding-bottom: 4px;
  }
  table.card input.mark-birdie{
    border: 2px solid var(--clay);
    border-radius: 50%;
    padding: 3px 1px;
  }
  table.card input.mark-bogey{
    border: 2px solid #000;
    border-radius: 2px;
    padding: 3px 1px;
  }
  table.card input.mark-dblbogey{
    border: 2px solid #000;
    border-radius: 1px;
    padding: 3px 1px;
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000;
    margin: 0 auto;
  }
  .team-mark{
    display: inline-flex;
    align-items:center;
    justify-content:center;
    min-width: 20px;
    min-height: 18px;
    line-height: 1;
    box-sizing: border-box;
  }
  .team-mark.mark-birdie{
    border: 2px solid var(--clay);
    border-radius: 50%;
    padding: 2px 3px;
  }
  .team-mark.mark-bogey{
    border: 2px solid #000;
    border-radius: 2px;
    padding: 2px 3px;
  }
  .team-mark.mark-dblbogey{
    border: 2px solid #000;
    border-radius: 1px;
    padding: 2px 3px;
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000;
    margin: 0 2px;
  }
  table.card tr.result-win td.holecol{ color: var(--up); font-weight:700; }
  table.card tr.result-lose td.holecol{ color: var(--down); font-weight:700; }
  .hole-result{
    font-family:'Space Mono', monospace;
    font-size: 11px;
  }
  th.team-best, td.team-best{
    background: rgba(31,58,92,0.06);
    color: var(--navy);
    font-weight: 700;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  tr.summary-row td.team-best{
    color: var(--navy);
  }
  .segment-label{
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--clay);
    text-align:left;
    padding: 10px 4px 4px !important;
    border-bottom:none !important;
  }
  tr.summary-row td{
    background: rgba(31,58,92,0.06);
    font-weight: 700;
    border-top: 1.5px solid var(--navy);
    border-bottom: 1.5px solid var(--navy);
  }
  tr.summary-row td.holecol{
    color: var(--navy);
    letter-spacing: 0.04em;
  }
  tr.summary-row td.hole-result{
    color: var(--clay);
    font-size: 10.5px;
    white-space: nowrap;
    text-align: right;
    padding-right: 6px;
  }

  .seg-tables{
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .seg-table-wrap{ width: 100%; }
  .seg-table-title{
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 6px;
  }
  table.seg-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  table.seg-table th{
    font-family:'Space Mono',monospace;
    font-size: 9.5px;
    letter-spacing: 0.05em;
    color: var(--navy-soft);
    font-weight: 400;
    text-align: center;
    padding: 4px 3px;
    border-bottom: 1px solid var(--line);
  }
  table.seg-table th:first-child{ text-align:left; }
  table.seg-table td{
    padding: 6px 3px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  table.seg-table td.seg-lbl{
    text-align: left;
    font-family:'Space Mono',monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: var(--navy);
    font-weight: 700;
  }
  table.seg-table td.seg-result{
    font-family:'Space Mono',monospace;
    font-size: 10.5px;
    color: var(--clay);
    white-space: nowrap;
  }
  table.seg-table td.seg-pts{
    font-weight: 700;
    color: var(--ink);
  }
  table.seg-table tr.seg-total-row td{
    border-top: 1px dashed var(--line);
    border-bottom: none;
    padding-top: 8px;
  }
  table.seg-table tr.seg-total-row td.seg-lbl{ color: var(--clay); }
  table.seg-table tr.seg-total-row td.seg-pts{
    color: var(--clay);
    font-size: 16px;
  }

  .setup-block{ margin-bottom: 26px; }
  .restore-block{
    padding: 12px;
    background: rgba(166,57,44,0.06);
    border: 1px solid var(--clay);
    border-radius: 6px;
  }
  .restore-btn{
    width: 100%;
    padding: 10px 14px;
    background: var(--clay);
    color: var(--birch);
    border: none;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    font-weight: 700;
    cursor: pointer;
  }
  .restore-btn:active{ opacity: 0.85; }
  .setup-block h3{ font-family:'Playfair Display', serif; font-size:16px; font-weight:700; color: var(--navy); margin: 0 0 8px; }
  .setup-block h3 .round-tag{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--clay);
  }
  .setup-block .sub{ font-size:11px; letter-spacing:0.06em; color: var(--navy-soft); font-family:'Space Mono',monospace; margin-bottom:10px;}
  .hc-grid{
    display:grid;
    grid-template-columns: 1fr repeat(5, 52px);
    gap: 6px;
    align-items:center;
    font-size: 13px;
  }
  .hc-grid .hdr{ font-family:'Space Mono',monospace; font-size:10px; color: rgba(35,36,32,0.5); text-align:center;}
  .hc-grid input{
    width:100%;
    text-align:center;
    border:1px solid var(--line);
    border-radius:3px;
    padding:6px 2px;
    font-family:'Space Mono',monospace;
    background:#fff;
  }
  .hc-grid input[data-handicap-golfer]{
    border-color: var(--clay);
    color: var(--clay);
    font-weight:700;
    background: rgba(166,57,44,0.05);
  }
  .hc-grid .hc-calc{
    text-align:center;
    font-family:'Space Mono',monospace;
    color: var(--navy);
    font-weight:600;
    padding: 6px 2px;
  }
  .sf-grid{
    display:grid;
    grid-template-columns: 1fr 80px;
    gap: 6px;
    align-items:center;
    font-size: 13.5px;
    max-width: 240px;
  }
  .sf-grid .sf-hdr{
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:0.06em;
    color: var(--navy-soft);
  }
  .sf-grid input{
    width:100%;
    text-align:center;
    border:1px solid var(--line);
    border-radius:3px;
    padding:6px 2px;
    font-family:'Space Mono',monospace;
    background:#fff;
  }
  .scorecard-scroll{
    overflow-x: auto;
    margin-bottom: 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .course-grid{
    display:grid;
    grid-template-columns: 54px repeat(18, 42px);
    width: max-content;
    font-size:11.5px;
  }
  .course-grid.with-sums{
    grid-template-columns: 54px repeat(18, 42px) repeat(3, 50px);
  }
  .course-grid.snake-grid{
    grid-template-columns: 54px repeat(18, 56px);
  }
  .snake-cell select{
    width: 100%;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 5px 1px;
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    background: #fff;
    color: var(--ink);
  }
  .snake-tag{
    font-size: 10px;
    vertical-align: middle;
  }
  .hole-snake-tag{
    position: absolute;
    top: 50%;
    right: -9px;
    transform: translateY(-50%);
    font-size: 9px;
    line-height: 1;
    pointer-events: none;
  }
  .snake-count-cell{
    text-align: center;
    font-size: 13px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .snake-block{ margin-top: 8px; }
  .snake-block h3{ display:flex; align-items:center; gap:6px; }
  .status-banner.snake-status{
    background: var(--clay);
    padding: 10px;
    margin-bottom: 12px;
  }
  .status-banner.snake-status .line1{
    font-size: 14px;
  }
  .course-grid .sumcol{
    background: rgba(166,57,44,0.06);
    font-weight: 700;
    color: var(--clay);
  }
  .course-grid .holenum.sumcol{
    font-size: 9px;
    letter-spacing: 0.02em;
  }
  .course-grid .cell.sumcol{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono',monospace;
    color: var(--clay);
  }
  .course-grid .rowlbl{
    font-family:'Space Mono',monospace;
    letter-spacing:0.04em;
    color: var(--navy-soft);
    display:flex; align-items:center;
    padding: 4px 6px;
    background: rgba(31,58,92,0.05);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    position: sticky; left: 0;
  }
  .course-grid .holenum{
    font-family:'Space Mono',monospace;
    font-size: 10px;
    color: var(--clay);
    text-align:center;
    padding: 5px 2px;
    border-bottom: 1px solid var(--line);
    background: rgba(166,57,44,0.05);
  }
  .course-grid .cell{
    padding: 3px;
    border-bottom: 1px solid var(--line);
  }
  .course-grid input{
    width:100%;
    text-align:center;
    border:1px solid var(--line);
    border-radius:3px;
    padding:5px 1px;
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    background:#fff;
  }
  .save-note{
    font-family:'Space Mono',monospace;
    font-size: 11px;
    color: var(--navy-soft);
    margin-top: 6px;
    min-height: 14px;
  }

  table.leader{
    width:100%;
    border-collapse:collapse;
    font-size: 13.5px;
  }
  table.leader th, table.leader td{
    padding: 10px 6px;
    text-align:center;
    border-bottom: 1px solid var(--line);
  }
  table.leader th{
    font-family:'Space Mono',monospace;
    font-size: 10px;
    letter-spacing:0.06em;
    color: var(--navy-soft);
    font-weight:400;
  }
  table.leader td.name{ text-align:left; font-weight:700; color: var(--navy); }
  .gold-star{
    color: #D4AF37;
    font-size: 13px;
    vertical-align: middle;
  }

  .chart-section{ margin-top: 8px; }
  .chart-controls{
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .chart-control-row{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chart-toggle{
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    padding: 7px 10px;
    border: 1px solid var(--navy);
    background: #fff;
    color: var(--navy);
    border-radius: 4px;
    cursor: pointer;
  }
  .chart-toggle.active{
    background: var(--navy);
    color: var(--birch);
  }
  .chart-empty{
    padding: 30px 10px;
    text-align: center;
    color: var(--navy-soft);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    border: 1px dashed var(--line);
    border-radius: 6px;
  }
  .hole-chart-svg{
    width: 100%;
    height: auto;
    display: block;
  }
  .chart-legend{
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .chart-legend-item{
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--navy);
  }
  .chart-legend-dot{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }
  .chart-legend-dot.par-dot{
    background: none;
    border-top: 2px dashed rgba(31,58,92,0.5);
    width: 12px;
    height: 0;
    border-radius: 0;
  }

let suppressNextRemoteRender = false; // avoids a redundant re-render right after our own write lands

function collectState(){
  return { courseData, golferHandicaps, scores, stablefordTable, snakeData };
}

async function loadInitialState(){
  try{
    const snapshot = await withTimeout(tripRef.get(), PERSIST_TIMEOUT_MS);
    return snapshot.exists() ? snapshot.val() : {};
  }catch(e){
    console.error('initial load failed', e);
    return {};
  }
}

function applyRemoteState(saved){
  if(!saved) return;
  if(saved.courseData) courseData = saved.courseData;
  if(saved.golferHandicaps) golferHandicaps = saved.golferHandicaps;
  recalcAllHandicaps();
  if(saved.scores){
    Object.keys(saved.scores).forEach(rid=>{
      Object.keys(saved.scores[rid]).forEach(gid=>{
        if(scores[rid] && scores[rid][gid]) scores[rid][gid] = saved.scores[rid][gid];
      });
    });
  }
  if(saved.stablefordTable) stablefordTable = saved.stablefordTable;
  if(saved.snakeData){
    Object.keys(saved.snakeData).forEach(rid=>{
      if(snakeData[rid]) snakeData[rid] = saved.snakeData[rid];
    });
  }
}

// Live sync: fires on our own writes too, and on every other viewer's writes.
// Immediately after our own successful write we skip one render to avoid a
// visible flicker/focus-loss right as someone is mid-entry.
tripRef.on('value', (snapshot) => {
  if(suppressNextRemoteRender){
    suppressNextRemoteRender = false;
    return;
  }
  applyRemoteState(snapshot.val());
  renderAll();
});

let pendingPersistCount = 0;
let lastPersistFailed = false;
let persistDebounceTimer = null;
const PERSIST_DEBOUNCE_MS = 900;
const PERSIST_TIMEOUT_MS = 20000;

function setSaveStatusUI(state){
  const pill = document.getElementById('saveStatusPill');
  if(!pill) return;
  pill.classList.remove('saving','saved','error','hidden');
  if(state==='saving'){
    pill.textContent = 'Saving…';
    pill.classList.add('saving');
  } else if(state==='saved'){
    pill.textContent = '\u2713 Saved';
    pill.classList.add('saved');
    clearTimeout(pill._hideTimer);
    pill._hideTimer = setTimeout(()=>{ pill.classList.add('hidden'); }, 2200);
  } else if(state==='error'){
    pill.textContent = 'Failed to save — tap to retry';
    pill.classList.add('error');
  } else {
    pill.classList.add('hidden');
  }
}

function withTimeout(promise, ms){
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error('save timed out')), ms);
    promise.then(
      v => { clearTimeout(t); resolve(v); },
      e => { clearTimeout(t); reject(e); }
    );
  });
}

async function doPublish(){
  let failed = false;
  try{
    suppressNextRemoteRender = true;
    await withTimeout(tripRef.set(collectState()), PERSIST_TIMEOUT_MS);
  }catch(e){
    console.error('save failed or timed out', e);
    suppressNextRemoteRender = false;
    failed = true;
  }
  pendingPersistCount = Math.max(0, pendingPersistCount - 1);
  lastPersistFailed = failed;
  if(pendingPersistCount === 0){
    setSaveStatusUI(failed ? 'error' : 'saved');
  }
}

// Debounced: rapid successive edits (e.g. clearing many fields) collapse into
// a single write instead of sending one database write per keystroke.
let persistQueue = Promise.resolve();
function persistState(){
  setSaveStatusUI('saving');
  clearTimeout(persistDebounceTimer);
  persistDebounceTimer = setTimeout(() => {
    pendingPersistCount++;
    persistQueue = persistQueue.then(doPublish);
  }, PERSIST_DEBOUNCE_MS);
}

function retryPersist(){
  if(pendingPersistCount > 0) return; // already trying
  pendingPersistCount++;
  setSaveStatusUI('saving');
  persistQueue = persistQueue.then(doPublish);
}

// Best-effort: if the page is closed/backgrounded right after an edit, don't
// lose a save that's still sitting in the debounce window.
function flushPendingPersist(){
  if(persistDebounceTimer){
    clearTimeout(persistDebounceTimer);
    persistDebounceTimer = null;
    pendingPersistCount++;
    persistQueue = persistQueue.then(doPublish);
  }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flushPendingPersist();
});
window.addEventListener('pagehide', flushPendingPersist);

// ---------------- stroke allocation ----------------
function strokesOnHole(courseHandicap, si){
  if(courseHandicap == null || isNaN(courseHandicap)) return 0;
  const ch = Number(courseHandicap);
  let s = 0;
  if(ch >= si) s += 1;
  if(ch >= si + 18) s += 1;
  return s;
}
// USGA Course Handicap formula, adjusted to 90%:
// Course Handicap = (Handicap Index x (Slope / 113) + (Rating - Par)) x 0.90
function computeCourseHandicap(index, course){
  if(index==null || isNaN(index) || !course || course.slope==null || course.rating==null || course.totalPar==null) return null;
  const raw = Number(index) * (course.slope / 113) + (course.rating - course.totalPar);
  return Math.round(raw * 0.90);
}
function recalcAllHandicaps(){
  ROUNDS.forEach(r=>{
    const course = courseData[r.course];
    const golfersInRound = r.format==='fourball' ? [...r.teamA, ...r.teamB] : GOLFERS.map(g=>g.id);
    golfersInRound.forEach(gid=>{
      handicaps[r.id][gid] = computeCourseHandicap(golferHandicaps[gid], course);
    });

}
const DEFAULT_STABLEFORD_TABLE = { dblEagle:4, eagle:3, birdie:2, par:1, bogey:0 };
async function restoreTripDefaults(){
  courseData = JSON.parse(JSON.stringify(COURSES));
  stablefordTable = JSON.parse(JSON.stringify(DEFAULT_STABLEFORD_TABLE));
  recalcAllHandicaps();
  await persistState();
  renderAll();
}
function stablefordPts(netScore, par){
  const diff = netScore - par;
  if(diff <= -3) return stablefordTable.dblEagle;
  if(diff === -2) return stablefordTable.eagle;
  if(diff === -1) return stablefordTable.birdie;
  if(diff === 0) return stablefordTable.par;
  if(diff === 1) return stablefordTable.bogey;
  return 0; // net double bogey or worse
}

// ---------------- round panel: fourball ----------------
function computeFourball(r){
  const holes = courseData[r.course].holes;
  const rowResults = []; // 'A' | 'B' | 'T' | null
  const bestNetA = []; // team A's lowest net score per hole, or null if not enough data
  const bestNetB = []; // team B's lowest net score per hole, or null if not enough data
  const bestGrossA = []; // team A's lowest gross score per hole (independent of who had the best net)
  const bestGrossB = []; // team B's lowest gross score per hole (independent of who had the best net)
  let tallyA = 0, tallyB = 0, holesPlayed = 0;
  let frontTallyA = 0, frontTallyB = 0, holesPlayedFront = 0;
  let backTallyA = 0, backTallyB = 0, holesPlayedBack = 0;

  for(let h=0; h<18; h++){
    const par = holes[h].par, si = holes[h].si;
    const entriesA = r.teamA.map(gid=>{
      const gross = scores[r.id][gid][h];
      if(gross==null) return null;
      return { gross, net: gross - strokesOnHole(handicaps[r.id][gid], si) };
    }).filter(v=>v!=null);
    const entriesB = r.teamB.map(gid=>{
      const gross = scores[r.id][gid][h];
      if(gross==null) return null;
      return { gross, net: gross - strokesOnHole(handicaps[r.id][gid], si) };
    }).filter(v=>v!=null);

    const bestNetEntryA = entriesA.length ? entriesA.reduce((a,b)=> b.net < a.net ? b : a) : null;
    const bestNetEntryB = entriesB.length ? entriesB.reduce((a,b)=> b.net < a.net ? b : a) : null;
    bestNetA.push(bestNetEntryA ? bestNetEntryA.net : null);
    bestNetB.push(bestNetEntryB ? bestNetEntryB.net : null);
    bestGrossA.push(entriesA.length ? Math.min(...entriesA.map(e=>e.gross)) : null);
    bestGrossB.push(entriesB.length ? Math.min(...entriesB.map(e=>e.gross)) : null);

    if(entriesA.length===0 || entriesB.length===0){ rowResults.push(null); continue; }
    holesPlayed++;
    if(h<9) holesPlayedFront++; else holesPlayedBack++;
    const bestA = bestNetEntryA.net, bestB = bestNetEntryB.net;
    let res;
    if(bestA < bestB){ res='A'; tallyA++; if(h<9) frontTallyA++; else backTallyA++; }
    else if(bestB < bestA){ res='B'; tallyB++; if(h<9) frontTallyB++; else backTallyB++; }
    else { res='T'; }
    rowResults.push(res);
  }
  return { rowResults, bestNetA, bestNetB, bestGrossA, bestGrossB, tallyA, tallyB, holesPlayed,
    frontTallyA, frontTallyB, holesPlayedFront,
    backTallyA, backTallyB, holesPlayedBack };
}

function segmentResultText(tallyA, tallyB, holesPlayed, requiredHoles, nameA, nameB){
  if(holesPlayed===0) return 'Not started';
  const diff = tallyA - tallyB;
  const complete = holesPlayed===requiredHoles;
  let core;
  if(diff===0) core = 'All square';
  else if(diff>0) core = `${nameA} ${diff} UP`;
  else core = `${nameB} ${-diff} UP`;
  return complete ? core : `${core} (thru ${holesPlayed})`;
}

function segmentPoints(tallyA, tallyB, holesPlayed, requiredHoles){
  if(holesPlayed !== requiredHoles) return { ptsA:null, ptsB:null };
  if(tallyA>tallyB) return { ptsA:1, ptsB:0 };
  if(tallyB>tallyA) return { ptsA:0, ptsB:1 };
  return { ptsA:0.5, ptsB:0.5 };
}

function playerSegmentSum(rId, gid, startHole, endHole){
  let sum = 0, count = 0;
  for(let h=startHole; h<=endHole; h++){
    const v = scores[rId][gid][h];
    if(v!=null){ sum += v; count++; }
  }
  return count>0 ? sum : null;
}

// A golfer's completed 18-hole gross score for a round — only returns a value once all 18 holes are entered
function playerCompletedRoundGross(rId, gid){
  let sum = 0, count = 0;
  for(let h=0; h<18; h++){
    const v = scores[rId][gid][h];
    if(v!=null){ sum += v; count++; }
  }
  return count===18 ? sum : null;
}

// A golfer's completed 9-hole gross total (front: 0-8, back: 9-17) — only counts when all 9 holes are entered
function playerCompletedNineGross(rId, gid, startHole, endHole){
  let sum = 0, count = 0;
  for(let h=startHole; h<=endHole; h++){
    const v = scores[rId][gid][h];
    if(v!=null){ sum += v; count++; }
  }
  return count===9 ? sum : null;
}

// Average gross score for a golfer across every recorded hole of a given par (e.g. all Par 3s, all rounds)
function parAvgGross(gid, parValue){
  let sum = 0, count = 0;
  ROUNDS.forEach(r=>{
    const holes = courseData[r.course].holes;
    for(let h=0; h<18; h++){
      if(holes[h].par !== parValue) continue;
      const gross = scores[r.id][gid] ? scores[r.id][gid][h] : null;
      if(gross!=null){ sum += gross; count++; }
    }
  });
  return count>0 ? sum/count : null;
}

// Counts net birdies (net score exactly one under par) for a golfer across every hole they've played, all rounds
function countNetBirdies(gid){
  let count = 0;
  ROUNDS.forEach(r=>{
    const holes = courseData[r.course].holes;
    for(let h=0; h<18; h++){
      const gross = scores[r.id][gid] ? scores[r.id][gid][h] : null;
      if(gross==null) continue;
      const strokes = strokesOnHole(handicaps[r.id][gid], holes[h].si);
      const net = gross - strokes;
      if(net - holes[h].par === -1) count++;
    }
  });
  return count;
}

function ordinal(n){
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

// Sum of NET scores (gross minus strokes received) over a hole range
function netPlayerSegmentSum(rId, gid, courseHoles, startHole, endHole){
  let sum = 0, count = 0;
  for(let h=startHole; h<=endHole; h++){
    const gross = scores[rId][gid][h];
    if(gross!=null){
      const strokes = strokesOnHole(handicaps[rId][gid], courseHoles[h].si);
      sum += gross - strokes;
      count++;
    }
  }
  return count>0 ? sum : null;
}

// Same marking logic, starting directly from a net score: net eagle-or-better + birdie = red circle,
// net bogey = black square, net double bogey or worse = double black square
function netScoreMarkClass(net, par){
  if(net==null) return '';
  const diff = net - par;
  if(diff <= -1) return 'mark-birdie';
  if(diff === 1) return 'mark-bogey';
  if(diff >= 2) return 'mark-dblbogey';
  return '';
}

function segMarginText(marginSigned, holesPlayedSeg, requiredHoles){
  if(holesPlayedSeg===0) return 'Not started';
  if(marginSigned===0) return 'All Square';
  return `${Math.abs(marginSigned)} ${marginSigned>0 ? 'UP' : 'DOWN'}`;
}

function buildRoundSummary(nameA, nameB, tallyA, tallyB, holesPlayed,
  frontTallyA, frontTallyB, holesPlayedFront,
  backTallyA, backTallyB, holesPlayedBack,
  frontPts, backPts, totalPts){

  if(holesPlayed===0 && holesPlayedFront===0 && holesPlayedBack===0){
    return { line1:'Match not started', line2:'FRONT · Not started', line3:'BACK · Not started' };
  }

  const overallDiff = tallyA - tallyB;
  const refSide = overallDiff >= 0 ? 'A' : 'B'; // defaults to A on a tie
  const refName = refSide==='A' ? nameA : nameB;

  const overallMargin = refSide==='A' ? overallDiff : -overallDiff;
  const frontMargin = refSide==='A' ? (frontTallyA - frontTallyB) : (frontTallyB - frontTallyA);
  const backMargin = refSide==='A' ? (backTallyA - backTallyB) : (backTallyB - backTallyA);

  const overallPts = refSide==='A' ? totalPts.ptsA : totalPts.ptsB;
  const frontPtsVal = refSide==='A' ? frontPts.ptsA : frontPts.ptsB;
  const backPtsVal = refSide==='A' ? backPts.ptsA : backPts.ptsB;

  const ptsStr = v => v==null ? '—' : `${v}pt`;

  const overallHeadline = overallMargin===0 ? 'All Square' : `${refName} - ${overallMargin} UP`;
  const line1 = holesPlayed===0 ? 'Match not started' : `${overallHeadline} · Overall · ${ptsStr(overallPts)}`;
  const line2 = `FRONT · ${segMarginText(frontMargin, holesPlayedFront, 9)} · ${ptsStr(frontPtsVal)}`;
  const line3 = `BACK · ${segMarginText(backMargin, holesPlayedBack, 9)} · ${ptsStr(backPtsVal)}`;

  return { line1, line2, line3 };
}

function golferShort(gid){
  return golferName(gid).split(' ')[0];
}

// ---------------- snake side game ----------------
function currentSnakeHolder(roundId){
  const arr = snakeData[roundId];
  if(!arr) return null;
  for(let h=17; h>=0; h--){
    if(arr[h]) return { gid: arr[h], hole: h+1 };
  }
  return null;
}

// A round only counts toward final snake tallies once every golfer in it has a complete 18-hole score
function isRoundFullyScored(r){
  const golfersInRound = r.format==='fourball' ? [...r.teamA, ...r.teamB] : GOLFERS.map(g=>g.id);
  return golfersInRound.every(gid => playerCompletedRoundGross(r.id, gid) !== null);
}

function countFinalSnakes(gid){
  return ROUNDS.filter(r => isRoundFullyScored(r) && currentSnakeHolder(r.id) && currentSnakeHolder(r.id).gid === gid).length;
}

function renderSnakeSection(r, golfersInRound){
  const holder = currentSnakeHolder(r.id);
  const arr = snakeData[r.id];
  const statusText = holder
    ? `${golferShort(holder.gid)} is holding the snake &middot; since Hole ${holder.hole}`
    : 'No one has 3-putted yet';

  const cells = arr.map((gid,h)=> `
    <div class="cell snake-cell">
      <select data-snake-round="${r.id}" data-snake-hole="${h}">
        <option value="">&mdash;</option>
        ${golfersInRound.map(pid=>`<option value="${pid}" ${gid===pid?'selected':''}>${golferShort(pid)}</option>`).join('')}
      </select>
    </div>`).join('');

  const holeRow = arr.map((v,h)=>`<div class="holenum">${h+1}</div>`).join('');

  return `
    <div class="setup-block snake-block">
      <h3>&#128013; Snake</h3>
      <div class="sub">FLAG WHO 3-PUTTED EACH HOLE &mdash; THE SNAKE PASSES TO THE LAST PLAYER TO 3-PUTT</div>
      <div class="status-banner snake-status">
        <div class="line1">&#128013; ${statusText}</div>
      </div>
      <div class="scorecard-scroll">
        <div class="course-grid snake-grid">
          <div class="rowlbl">HOLE</div>${holeRow}
          <div class="rowlbl">3-PUTT</div>${cells}
        </div>
      </div>
    </div>`;
}

function wireSnakeSection(roundId){
  document.querySelectorAll(`[data-snake-round="${roundId}"]`).forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const h = Number(sel.dataset.snakeHole);
      snakeData[roundId][h] = sel.value === '' ? null : sel.value;
      await persistState();
      renderAll();
    });
  });
}

// ---------------- round panel: singles stableford ----------------
function computeSinglesRound(r){
  const holes = courseData[r.course].holes;
  const totals = {};
  GOLFERS.forEach(g=>{
    let total = 0, played = 0;
    for(let h=0; h<18; h++){
      const gross = scores[r.id][g.id][h];
      if(gross==null) continue;
      played++;
      const net = gross - strokesOnHole(handicaps[r.id][g.id], holes[h].si);
      total += stablefordPts(net, holes[h].par);
    }
    totals[g.id] = { total, played };
  });
  return totals;
}

function renderSinglesRound(r){
  const c = courseData[r.course];
  const totals = computeSinglesRound(r);
  const sorted = [...GOLFERS].sort((a,b)=> totals[b.id].total - totals[a.id].total);
  const snakeHolder = currentSnakeHolder(r.id);

  let html = `

    <div class="scorecard-scroll">
    <table class="card"><thead><tr>
      <th class="holecol">HOLE</th><th>PAR</th><th>YDS</th><th>IDX</th><th>SCORE</th><th>NET</th><th>PTS</th>
    </tr></thead><tbody>`;
    for(let h=0; h<18; h++){
      const par = c.holes[h].par, si = c.holes[h].si, yards = c.holes[h].yards;

      html += `<tr>

        <td class="mono">${par}</td>

      await persistState();
      flashNote('note-'+r.id);

// ---------------- leaderboard ----------------
function computeLeaderboardRows(){
  const perRoundPts = {}; // {golferId: [r1,r2,r3,r4]}
  GOLFERS.forEach(g=> perRoundPts[g.id] = [null,null,null,null]);

  ROUNDS.forEach((r, ri)=>{
    if(r.format==='fourball'){
      const {
        tallyA, tallyB, holesPlayed,
        frontTallyA, frontTallyB, holesPlayedFront,
        backTallyA, backTallyB, holesPlayedBack
      } = computeFourball(r);
      const frontPts = segmentPoints(frontTallyA, frontTallyB, holesPlayedFront, 9);
      const backPts = segmentPoints(backTallyA, backTallyB, holesPlayedBack, 9);
      const totalPts = segmentPoints(tallyA, tallyB, holesPlayed, 18);
      if(frontPts.ptsA!=null && backPts.ptsA!=null && totalPts.ptsA!=null){
        const ptsA = frontPts.ptsA + backPts.ptsA + totalPts.ptsA;
        const ptsB = frontPts.ptsB + backPts.ptsB + totalPts.ptsB;
        r.teamA.forEach(gid=> perRoundPts[gid][ri] = ptsA);
        r.teamB.forEach(gid=> perRoundPts[gid][ri] = ptsB);
      }
    } else {
      const totals = computeSinglesRound(r);
      GOLFERS.forEach(g=>{
        if(totals[g.id].played===18) perRoundPts[g.id][ri] = totals[g.id].total;
      });
    }
  });

  return GOLFERS.map(g=>{
    const pts = perRoundPts[g.id];
    const agg = pts.reduce((sum,v)=> sum + (v ?? 0), 0);
    const roundGrossTotals = ROUNDS
      .map(r => playerCompletedRoundGross(r.id, g.id))
      .filter(v => v != null);
    const lowRd = roundGrossTotals.length ? Math.min(...roundGrossTotals) : null;
    return { g, pts, agg, lowRd };
  }).sort((a,b)=> b.agg - a.agg);
}

function renderLeaderboard(){
  const rows = computeLeaderboardRows();

  let html = `<table class="leader"><thead><tr>
      <th style="text-align:left;">GOLFER</th>
      <th>RD1</th><th>RD2</th><th>RD3</th><th>RD4</th><th>TOTAL</th><th>LOW RD (G)</th>
    </tr></thead><tbody>`;
  rows.forEach((row, i)=>{
    const isLeader = i===0 && row.agg>0;
    html += `<tr class="${isLeader ? 'leader-first':''}">
      <td class="name">${row.g.name}${isLeader ? ' <span class="gold-star" title="1st place">&#9733;</span>' : ''}</td>
      ${row.pts.map(p=>`<td class="mono">${p ?? '—'}</td>`).join('')}
      <td class="agg">${row.agg}</td>
      <td class="mono low-rd">${row.lowRd ?? '—'}</td>
    </tr>`;
  });
  html += `</tbody></table>
  <p class="save-note" style="margin-top:14px;">Four-ball rounds award 1 point each for the front nine, back nine, and overall 18 (0.5/0.5 on a tie) — up to 3 points per golfer, posted once each segment is complete. Singles Stableford points post once the round is complete. Low Rd shows each golfer's lowest completed 18-hole gross score across all four rounds played so far.</p>`;

  document.getElementById('panel-leader').innerHTML = html;
}

// ---------------- trip summary ----------------
function renderHoleChart(){
  const wrap = document.getElementById('holeChartWrap');
  if(!wrap) return;

  const r = ROUNDS.find(rr=>rr.id===summaryChartRoundId);
  const course = courseData[r.course];
  const holes = course.holes;
  const golfersInRound = r.format==='fourball' ? [...r.teamA, ...r.teamB] : GOLFERS.map(g=>g.id);

  // Build each golfer's per-hole series in the selected mode (gross or net)
  const series = golfersInRound.map((gid, idx)=>{
    const values = [];
    for(let h=0; h<18; h++){
      const gross = scores[r.id][gid][h];
      if(gross==null){ values.push(null); continue; }
      if(summaryChartMode==='gross'){ values.push(gross); }
      else {
        const strokes = strokesOnHole(handicaps[r.id][gid], holes[h].si);
        values.push(gross - strokes);
      }
    }
    return { gid, name: golferName(gid), color: GOLFER_COLORS[GOLFERS.findIndex(g=>g.id===gid)], values };
  });

  const parValues = holes.map(h=>h.par);
  const allVals = series.flatMap(s=>s.values).filter(v=>v!=null).concat(parValues);

  if(allVals.length <= parValues.length){
    // no scores entered yet for this round
    wrap.innerHTML = `<div class="chart-empty">No scores entered yet for this round.</div>`;
    return;
  }

  const minV = Math.min(...allVals) - 1;
  const maxV = Math.max(...allVals) + 1;

  const W = 700, H = 320;
  const padL = 34, padR = 14, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const xFor = i => padL + (i/17) * plotW; // i = 0..17 (hole index)
  const yFor = v => padT + plotH - ((v - minV) / (maxV - minV)) * plotH;

  // Y-axis ticks
  const tickCount = 5;
  const ticks = [];
  for(let t=0; t<=tickCount; t++){
    const v = minV + (t/tickCount) * (maxV - minV);
    ticks.push(v);
  }

  // Par reference line (dashed)
  const parPath = holes.map((h,i)=> `${i===0?'M':'L'} ${xFor(i).toFixed(1)} ${yFor(h.par).toFixed(1)}`).join(' ');

  // Front/back divider
  const dividerX = (xFor(8) + xFor(9)) / 2;

  // Build a path per contiguous run of non-null values, per golfer
  const seriesSvg = series.map(s=>{
    let paths = [];
    let current = [];
    s.values.forEach((v,i)=>{
      if(v==null){
        if(current.length) paths.push(current);
        current = [];
      } else {
        current.push([i,v]);
      }
    });
    if(current.length) paths.push(current);

    const pathStrs = paths.map(pts =>
      pts.map(([i,v],j)=> `${j===0?'M':'L'} ${xFor(i).toFixed(1)} ${yFor(v).toFixed(1)}`).join(' ')
    ).join(' ');

    const dots = s.values.map((v,i)=> v==null ? '' :
      `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3" fill="${s.color}"><title>${s.name} — Hole ${i+1}: ${v}</title></circle>`
    ).join('');

    return `<path d="${pathStrs}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
  }).join('');

  const gridSvg = ticks.map(v =>
    `<line x1="${padL}" x2="${W-padR}" y1="${yFor(v).toFixed(1)}" y2="${yFor(v).toFixed(1)}" stroke="rgba(31,58,92,0.1)" stroke-width="1"/>
     <text x="${padL-6}" y="${(yFor(v)+3).toFixed(1)}" text-anchor="end" font-size="9" font-family="'Space Mono',monospace" fill="rgba(31,58,92,0.55)">${v.toFixed(0)}</text>`
  ).join('');

  const xLabelsSvg = holes.map((h,i)=>
    `<text x="${xFor(i).toFixed(1)}" y="${H-padB+14}" text-anchor="middle" font-size="9" font-family="'Space Mono',monospace" fill="rgba(31,58,92,0.55)">${i+1}</text>`
  ).join('');

  const legendSvg = series.map(s =>
    `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${s.color}"></span>${s.name}</div>`
  ).join('');

  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" class="hole-chart-svg" preserveAspectRatio="xMidYMid meet">
      ${gridSvg}
      <line x1="${dividerX.toFixed(1)}" x2="${dividerX.toFixed(1)}" y1="${padT}" y2="${H-padB}" stroke="var(--clay)" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
      <path d="${parPath}" fill="none" stroke="rgba(31,58,92,0.4)" stroke-width="1.5" stroke-dasharray="4,3"/>
      ${xLabelsSvg}
      <text x="${padL}" y="${H-6}" font-size="9" font-family="'Space Mono',monospace" fill="var(--clay)">HOLE</text>
      ${seriesSvg}
    </svg>
    <div class="chart-legend">
      ${legendSvg}
      <div class="chart-legend-item"><span class="chart-legend-dot par-dot"></span>Par (dashed)</div>
    </div>`;
}

function renderTripSummary(){
  const leaderboardRows = computeLeaderboardRows(); // sorted by agg desc, includes lowRd
  const positionByGolfer = {};
  leaderboardRows.forEach((row, i)=>{ positionByGolfer[row.g.id] = ordinal(i+1); });

  const summaryRows = GOLFERS.map(g=>{
    const roundGross = ROUNDS.map(r => playerCompletedRoundGross(r.id, g.id)).filter(v=>v!=null);
    const avgRd = roundGross.length ? roundGross.reduce((a,b)=>a+b,0)/roundGross.length : null;

    const frontGross = ROUNDS.map(r => playerCompletedNineGross(r.id, g.id, 0, 8)).filter(v=>v!=null);
    const frontAvg = frontGross.length ? frontGross.reduce((a,b)=>a+b,0)/frontGross.length : null;

    const backGross = ROUNDS.map(r => playerCompletedNineGross(r.id, g.id, 9, 17)).filter(v=>v!=null);
    const backAvg = backGross.length ? backGross.reduce((a,b)=>a+b,0)/backGross.length : null;

    const lowRd = leaderboardRows.find(row=>row.g.id===g.id).lowRd;
    const par3Avg = parAvgGross(g.id, 3);
    const par4Avg = parAvgGross(g.id, 4);
    const par5Avg = parAvgGross(g.id, 5);
    const netBirdies = countNetBirdies(g.id);
    const position = positionByGolfer[g.id];
    const snakeCount = countFinalSnakes(g.id);

    return { g, avgRd, frontAvg, backAvg, lowRd, par3Avg, par4Avg, par5Avg, netBirdies, position, snakeCount };
  });

  const fmt1 = v => v==null ? '—' : v.toFixed(1);

  let html = `
    <div class="round-head">
      <p class="course">Trip Summary</p>
      <p class="meta">PERFORMANCE ACROSS ALL FOUR RECORDED ROUNDS</p>
    </div>
    <div class="scorecard-scroll">
    <table class="leader">
      <thead><tr>
        <th style="text-align:left;">GOLFER</th>
        <th>AVG RD (G)</th>
        <th>FRONT 9 AVG (G)</th>
        <th>BACK 9 AVG (G)</th>
        <th>LOW RD (G)</th>
        <th>PAR 3 AVG (G)</th>
        <th>PAR 4 AVG (G)</th>
        <th>PAR 5 AVG (G)</th>
        <th>TTL NET BIRDS</th>
        <th>SNAKE(S)</th>
        <th>POSITION</th>
      </tr></thead>
      <tbody>
        ${summaryRows.map(row => `
          <tr>
            <td class="name">${row.g.name}</td>
            <td class="mono">${fmt1(row.avgRd)}</td>
            <td class="mono">${fmt1(row.frontAvg)}</td>
            <td class="mono">${fmt1(row.backAvg)}</td>
            <td class="mono low-rd">${row.lowRd ?? '—'}</td>
            <td class="mono">${fmt1(row.par3Avg)}</td>
            <td class="mono">${fmt1(row.par4Avg)}</td>
            <td class="mono">${fmt1(row.par5Avg)}</td>
            <td class="mono birdie-count">${row.netBirdies}</td>
            <td class="snake-count-cell">${row.snakeCount>0 ? '&#128013;'.repeat(row.snakeCount) : '—'}</td>
            <td class="mono position">${row.position}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    </div>
    <p class="save-note" style="margin-top:14px;">Averages and Low Rd only count rounds/nines where all holes have been entered. Par 3/4/5 averages count every individually recorded hole of that par across all rounds. TTL Net Birds counts every hole across all four rounds where a golfer's net score was exactly one under par. Snake(s) shows how many completed rounds that golfer ended up holding the snake. Position reflects current standing on the Leaderboard tab.</p>

    <div class="chart-section">
      <h3 style="font-family:'Playfair Display', serif; font-size:16px; font-weight:700; color: var(--navy); margin: 24px 0 4px;">Score by Hole</h3>
      <div class="chart-controls">
        <div class="chart-control-row" id="chartRoundControls">
          ${ROUNDS.map(r => `<button class="chart-toggle ${r.id===summaryChartRoundId?'active':''}" data-chart-round="${r.id}">RD ${r.num} · ${COURSE_SHORT_NAMES[r.course]}</button>`).join('')}
        </div>
        <div class="chart-control-row">
          <button class="chart-toggle ${summaryChartMode==='gross'?'active':''}" data-chart-mode="gross">GROSS</button>
          <button class="chart-toggle ${summaryChartMode==='net'?'active':''}" data-chart-mode="net">NET</button>
        </div>
      </div>
      <div id="holeChartWrap"></div>
    </div>`;

  document.getElementById('panel-summary').innerHTML = html;

  renderHoleChart();

  document.querySelectorAll('[data-chart-round]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      summaryChartRoundId = btn.dataset.chartRound;
      document.querySelectorAll('[data-chart-round]').forEach(b=> b.classList.toggle('active', b===btn));
      renderHoleChart();
    });
  });
  document.querySelectorAll('[data-chart-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      summaryChartMode = btn.dataset.chartMode;
      document.querySelectorAll('[data-chart-mode]').forEach(b=> b.classList.toggle('active', b===btn));
      renderHoleChart();
    });
  });
}

function renderAll(){
  renderTabs();
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-'+activeTab));

  if(activeTab==='setup') renderSetupPanel();
  else if(activeTab==='leader') renderLeaderboard();
  else if(activeTab==='summary') renderTripSummary();
  else {
    const r = ROUNDS.find(rr=>rr.id===activeTab);
    if(r.format==='fourball') renderFourballRound(r);
    else renderSinglesRound(r);
  }
}

function buildPanelShells(){
  const container = document.getElementById('panels');
  container.innerHTML = TAB_DEFS.map(t=>`<div class="panel" id="panel-${t.id}"></div>`).join('');
}

async function init(){
  buildPanelShells();
  renderBanner();
  setSaveStatusUI('idle');

  const saved = await loadInitialState();
  applyRemoteState(saved);

  renderBanner();
  renderAll();
}

init();
</script>
</body>
</html>
